{%- comment -%} Logo mark + wordmark. Inline-SVG fallback; drop assets/img/logo.svg to override visually via CSS if desired. {%- endcomment -%}
<span class="logo" aria-hidden="true">
  <svg class="logo__mark" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect width="32" height="32" rx="8" fill="url(#orGrad)"/>
    <path d="M7 24C11 14 21 14 25 8" stroke="#0b1220" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="0.2 4.2"/>
    <path d="M7 24C11 14 21 14 25 8" stroke="#e9edf5" stroke-width="1" stroke-linecap="round" stroke-dasharray="2.4 3.2"/>
    <circle cx="7" cy="24" r="2.6" fill="#0b1220"/><circle cx="7" cy="24" r="1.3" fill="#ffc24b"/>
    <circle cx="25" cy="8" r="2.6" fill="#0b1220"/><circle cx="25" cy="8" r="1.3" fill="#3dd7c4"/>
    <defs>
      <linearGradient id="orGrad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
        <stop stop-color="#2a6cf0"/><stop offset="1" stop-color="#1a3a7a"/>
      </linearGradient>
    </defs>
  </svg>
  <span class="logo__word">Open<span class="logo__word-accent">Road</span></span>
</span>
