{%- comment -%}
  Inline SVG icon helper. Usage: {% include icon.html name="pin" %}
  Optional: class="..." to add extra classes.
  Icons inherit currentColor via stroke.
{%- endcomment -%}
{%- assign n = include.name -%}
<svg class="icon icon--{{ n }} {{ include.class }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- case n -%}
{%- when 'pin' -%}
  <path d="M12 21s-6.5-5.4-6.5-10.1A6.5 6.5 0 0 1 12 4.4a6.5 6.5 0 0 1 6.5 6.5C18.5 15.6 12 21 12 21Z"/><circle cx="12" cy="10.6" r="2.4"/>
{%- when 'signal' -%}
  <rect x="8.5" y="3" width="7" height="15" rx="2"/><circle cx="12" cy="6.5" r="1.1"/><circle cx="12" cy="10.5" r="1.1"/><circle cx="12" cy="14.5" r="1.1"/><path d="M12 18v3"/>
{%- when 'bus' -%}
  <rect x="4" y="5" width="16" height="12" rx="2"/><path d="M4 12h16M8 17v2M16 17v2"/><circle cx="8" cy="14" r="0.9"/><circle cx="16" cy="14" r="0.9"/>
{%- when 'sign' -%}
  <path d="M12 3v3M12 20v-3"/><rect x="4" y="6" width="16" height="8" rx="2"/><path d="M8 10h.01M12 10h.01M16 10h.01"/>
{%- when 'route' -%}
  <circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M8 18h4a4 4 0 0 0 4-4V8"/>
{%- when 'wave' -%}
  <path d="M3 12c2-4 4-4 6 0s4 4 6 0 4-4 6 0"/><path d="M3 17c2-3 4-3 6 0"/>
{%- when 'video' -%}
  <rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3"/>
{%- when 'gps' -%}
  <circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
{%- when 'gauge' -%}
  <path d="M4 15a8 8 0 0 1 16 0"/><path d="M12 15l4-4"/><circle cx="12" cy="15" r="1"/>
{%- when 'swipe' -%}
  <path d="M9 6v9M9 6l-2 2M9 6l2 2"/><rect x="13" y="4" width="7" height="16" rx="2"/>
{%- when 'map' -%}
  <path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z"/><path d="M9 4v14M15 6v14"/>
{%- when 'export' -%}
  <path d="M12 15V3M12 3l-3 3M12 3l3 3"/><path d="M5 13v6a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-6"/>
{%- when 'users' -%}
  <circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M16 6a3 3 0 0 1 0 6M21 20a6 6 0 0 0-4-5.7"/>
{%- when 'layers' -%}
  <path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/>
{%- when 'check' -%}
  <path d="M20 6 9 17l-5-5"/>
{%- else -%}
  <circle cx="12" cy="12" r="9"/>
{%- endcase -%}
</svg>
