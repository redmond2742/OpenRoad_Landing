title: OpenRoad
tagline: Your drive, recorded as data.
description: >-
  OpenRoad is an iOS app that turns everyday trips into structured roadway data.
  Record video, GPS, speed, heading, and accelerometer data, process trips
  against existing inventory files, review observations with a swipe interface,
  map results, and export open formats like GeoJSON.

# Deployment: user/org site (served at the domain root). baseurl stays empty.
# To move to a project site (username.github.io/OpenRoad), set baseurl: "/OpenRoad".
# Every internal link uses relative_url, so this is the only place you change it.
url: "https://openroad-landing.onrender.com/"
baseurl: ""

author:
  name: The OpenRoad Team

# ---- Drop-in slots (fill these when assets/links are ready) ----
# Primary app CTA: if app_store_url is set it wins ("Download on the App Store");
# otherwise github_url is used ("View on GitHub"); if both are empty, a disabled
# "Coming soon" button shows. See _includes/app-button.html.
app_store_url: ""
github_url: "https://github.com/redmond2742/OpenRoad_iOS"
# Placeholder for the external Asset CSV Builder web app.
csv_builder_url: "https://openroad-data-tools.onrender.com/"

# Reference links for the data standards OpenRoad works with.
gtss_url: "https://gtss.dev/"
gtfs_url: "https://gtfs.org/"

# Swappable image assets. To replace one, either drop a new file at the same
# path in assets/img/ (keeping the filename), or point the value at a new file.
# Set a value to "" to hide that image (optional ones simply won't render).
images:
  hero:        /assets/img/hero-app.webp         # Home hero — OpenRoad recording a live trip
  app_process: /assets/img/screen-process.webp   # App page — "Process" screen
  app_review:  /assets/img/screen-review.webp    # App page — "Review" screen
  app_map:     /assets/img/screen-map.jpg        # App page — "Map" screen
  app_detects: /assets/img/screen-detects.webp   # App page — "What it detects" screen
  logo:        /assets/img/logo.svg              # optional standalone wordmark

# Social share / SEO preview image (used by jekyll-seo-tag as og:image).
# For best results across platforms, replace with a 1200x630 PNG or JPG and
# update this path accordingly.
image: /assets/img/og-image.svg
# Optional social handles used by jekyll-seo-tag.
twitter_username: ""
github_username: ""

# Primary navigation (data-driven; edit here to change the nav everywhere).
nav:
  - title: Home
    url: /
  - title: App
    url: /app/
  - title: CSV Builder
    url: /csv-builder/
  - title: Blog
    url: /blog/
  - title: About
    url: /about/

# Build settings
markdown: kramdown
permalink: /blog/:year/:month/:day/:title/
timezone: America/New_York

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# jekyll-feed output path
feed:
  path: feed.xml

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
    values:
      layout: page
      image: /assets/img/og-image.svg   # default social/SEO preview; override per page via front matter

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .jekyll-cache
  - node_modules
  - wrangler.toml
