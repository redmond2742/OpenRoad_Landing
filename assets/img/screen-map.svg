<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 660" role="img" aria-label="OpenRoad app — mapped results">
  <defs>
    <pattern id="gridM" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#17365d" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="320" height="660" fill="#efece1"/>

  <!-- status bar -->
  <rect width="320" height="34" fill="#fffdf7"/>
  <line x1="0" y1="34" x2="320" y2="34" stroke="#a7a091"/>
  <text x="14" y="22" font-family="Courier New, monospace" font-size="13" fill="#1c1c1a">9:41</text>
  <text x="196" y="22" font-family="Courier New, monospace" font-size="12" fill="#6a675e">12 observations</text>

  <!-- map area -->
  <rect x="0" y="34" width="320" height="480" fill="#efece1"/>
  <rect x="0" y="34" width="320" height="480" fill="url(#gridM)"/>
  <!-- roads -->
  <path d="M0 300 H320" stroke="#a7a091" stroke-width="10"/>
  <path d="M0 300 H320" stroke="#f6f4ec" stroke-width="1.4" stroke-dasharray="4 12"/>
  <path d="M160 34 V514" stroke="#a7a091" stroke-width="10"/>
  <path d="M160 34 V514" stroke="#f6f4ec" stroke-width="1.4" stroke-dasharray="4 12"/>
  <path d="M40 34 C 60 200, 220 240, 240 514" fill="none" stroke="#17365d" stroke-width="4"/>

  <!-- pins -->
  <g>
    <circle cx="90" cy="180" r="8" fill="#9a6b0f" stroke="#fffdf7" stroke-width="2"/>
    <circle cx="160" cy="300" r="8" fill="#97331f" stroke="#fffdf7" stroke-width="2"/>
    <circle cx="228" cy="360" r="8" fill="#1f6b6b" stroke="#fffdf7" stroke-width="2"/>
    <circle cx="120" cy="430" r="8" fill="#2f6b3f" stroke="#fffdf7" stroke-width="2"/>
    <circle cx="250" cy="150" r="8" fill="#97331f" stroke="#fffdf7" stroke-width="2"/>
    <circle cx="60" cy="470" r="8" fill="#9a6b0f" stroke="#fffdf7" stroke-width="2"/>
  </g>

  <!-- legend / export bar -->
  <line x1="0" y1="514" x2="320" y2="514" stroke="#a7a091"/>
  <rect x="0" y="514" width="320" height="146" fill="#fffdf7"/>
  <text x="20" y="544" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#17365d">Mapped results</text>
  <g font-family="Courier New, monospace" font-size="11" fill="#3f3f3a">
    <circle cx="26" cy="566" r="5" fill="#9a6b0f"/><text x="38" y="570">signal / signage</text>
    <circle cx="26" cy="586" r="5" fill="#97331f"/><text x="38" y="590">pavement event</text>
    <circle cx="176" cy="566" r="5" fill="#1f6b6b"/><text x="188" y="570">transit asset</text>
    <circle cx="176" cy="586" r="5" fill="#2f6b3f"/><text x="188" y="590">marking / crosswalk</text>
  </g>
  <rect x="20" y="610" width="160" height="30" rx="3" fill="#17365d"/>
  <text x="100" y="630" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Export GeoJSON</text>
  <rect x="192" y="610" width="108" height="30" rx="3" fill="#fffdf7" stroke="#a7a091"/>
  <text x="246" y="630" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#17365d">Share</text>
</svg>
