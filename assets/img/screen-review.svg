<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 660" role="img" aria-label="OpenRoad app — reviewing an observation">
  <rect width="320" height="660" fill="#efece1"/>

  <!-- status bar -->
  <rect width="320" height="34" fill="#fffdf7"/>
  <line x1="0" y1="34" x2="320" y2="34" stroke="#a7a091"/>
  <text x="14" y="22" font-family="Courier New, monospace" font-size="13" fill="#1c1c1a">9:41</text>
  <text x="240" y="22" font-family="Courier New, monospace" font-size="12" fill="#6a675e">3 / 18</text>

  <!-- header -->
  <text x="20" y="70" font-family="Georgia, serif" font-size="19" font-weight="bold" fill="#17365d">Review observations</text>
  <text x="20" y="92" font-family="Courier New, monospace" font-size="11" fill="#6a675e">SWIPE TO CONFIRM OR DISMISS</text>

  <!-- observation card -->
  <rect x="24" y="112" width="272" height="380" rx="4" fill="#fffdf7" stroke="#a7a091"/>
  <!-- image placeholder -->
  <rect x="40" y="128" width="240" height="180" rx="3" fill="#efece1" stroke="#cbc6b8"/>
  <path d="M40 308 L120 230 L170 270 L220 210 L280 260" fill="none" stroke="#a7a091" stroke-width="2"/>
  <circle cx="90" cy="170" r="14" fill="#cbc6b8"/>
  <text x="160" y="330" text-anchor="middle" font-family="Courier New, monospace" font-size="11" fill="#6a675e">frame @ 00:41 · 40.4421, -79.9953</text>

  <text x="40" y="366" font-family="Georgia, serif" font-size="17" font-weight="bold" fill="#1c1c1a">Stop sign — obstructed?</text>
  <text x="40" y="392" font-family="Georgia, serif" font-size="13" fill="#3f3f3a">Detected against CSV asset inventory.</text>
  <text x="40" y="412" font-family="Georgia, serif" font-size="13" fill="#3f3f3a">Vegetation may block the approach view.</text>
  <rect x="40" y="430" width="120" height="24" rx="3" fill="#efece1" stroke="#cbc6b8"/>
  <text x="50" y="447" font-family="Courier New, monospace" font-size="11" fill="#6a675e">type: stop_sign</text>

  <!-- swipe controls -->
  <circle cx="96" cy="556" r="34" fill="#fffdf7" stroke="#97331f" stroke-width="2"/>
  <path d="M84 544 L108 568 M108 544 L84 568" stroke="#97331f" stroke-width="3" stroke-linecap="round"/>
  <text x="96" y="614" text-anchor="middle" font-family="Courier New, monospace" font-size="11" fill="#6a675e">DISMISS</text>

  <circle cx="224" cy="556" r="34" fill="#fffdf7" stroke="#2f6b3f" stroke-width="2"/>
  <path d="M210 556 L220 568 L240 544" fill="none" stroke="#2f6b3f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="224" y="614" text-anchor="middle" font-family="Courier New, monospace" font-size="11" fill="#6a675e">CONFIRM</text>
</svg>
